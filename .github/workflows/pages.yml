# Publishes https://heroes-jym.com (GitHub Pages, custom domain via website/CNAME):
#
#   /             the project website (website/ — plain HTML, no build step)
#   /ar.html      the same site in Arabic
#   /demo/        the browser-only demo of the app
#   /MAHDI-JYM.apk  copy of the newest release APK (when a release exists)
#
# Pages serves static files only, so the demo has no backend — VITE_DEMO=1 makes the app
# boot straight into guest mode with a seeded example history (see frontend/src/lib/demo.js).
# The exercise images/GIFs (~140 MB) are never committed here; the demo build points at the
# upstream dataset on jsDelivr instead, pinned to a commit so the CDN can cache it forever.
#
# One-time setup: Settings → Pages → Source "GitHub Actions", custom domain heroes-jym.com
# (DNS: four A records 185.199.108-111.153 for the apex, CNAME www → m777m44.github.io).
name: Deploy website & demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'website/**'
      - 'assets/**'
      - 'scripts/build-site.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  DATASET: https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # demo build (VITE_DEMO=1, media from the pinned dataset) + website/ + screenshots +
      # icons + the newest release APK, all assembled into _site/
      - run: bash scripts/build-site.sh _site
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
