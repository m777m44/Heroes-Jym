# Publishes the project site on GitHub Pages — https://m777m44.github.io/Heroes-Jym/
#
#   /             the project website (website/ — plain HTML, no build step)
#   /ar.html      the same site in Arabic
#   /app/         12.0: the web app — the real MAHDI-JYM in your browser, your own data kept in
#                 that browser (VITE_WEBAPP=1)
#   /demo/        the browser-only demo with example data (VITE_DEMO=1)
#
# Pages serves static files only, so neither build has a backend — both boot straight into guest
# mode (see frontend/src/lib/demo.js). The exercise images/GIFs (~140 MB) are never committed
# here; both builds point at the upstream dataset on jsDelivr, pinned to a commit.
#
# One-time setup (needs a repository admin — the workflow token can't do it):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions".
# After that every push to main that touches the app or the site deploys it; "Run workflow"
# on the Actions tab deploys by hand.
#
# 13.0: while the source is still "Deploy from a branch", GitHub also runs its own Jekyll build
# of main on every push ("pages build and deployment") — and whichever deploy finishes last is
# what the site shows. `page_build` (fired by that build) runs this workflow once more right
# after it, so the website, the app and the demo always win. Our own deploy pushes nothing, so
# it never fires page_build itself; with the "GitHub Actions" source the event simply never comes.
name: Deploy website, web app & demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'website/**'
      - 'assets/**'
      - 'scripts/build-site.sh'
      - '.github/workflows/pages.yml'
  page_build:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  DATASET: https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # web app (VITE_WEBAPP=1) + demo (VITE_DEMO=1), media from the pinned dataset, + website/ +
      # screenshots + icons, all assembled into _site/
      - run: bash scripts/build-site.sh _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
