# Builds the Android app (Capacitor) in two versions and, for version tags, publishes both as a
# GitHub Release.
#
#   offline  MAHDI-JYM.apk         everything inside: all 1,324 exercise images + animations,
#                                  wallpapers and profile pictures (~135 MB) — works with no internet
#   online   MAHDI-JYM-online.apk  12.0: the same app, light — exercise media, wallpapers and the
#                                  ready-made profile pictures come from GitHub (jsDelivr, pinned
#                                  commits) when they are shown
#   Same features, same app id, same signature and version code: either one installs over the
#   other and the data stays. The step counter's JVM unit tests must pass first.
#
#   push to main / PR branch  →  both signed APKs uploaded as a workflow artifact
#   push tag v*               →  both attached to a GitHub Release, so
#                                https://github.com/m777m44/Heroes-Jym/releases/latest/download/MAHDI-JYM.apk
#                                and …/MAHDI-JYM-online.apk always point at the newest build
#
# Signing: if the repository secrets ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PASSWORD
# (optionally ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) exist they are used. Otherwise the
# committed public keystore in frontend/android/keystore/ signs the build — that keeps the
# signature identical across builds (so updates install over the old app without losing data)
# with zero setup. See docs/MOBILE.md → "Signing" before distributing the app widely.
name: Android APK

on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
    paths:
      - 'frontend/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Capacitor 7 / AGP 8.7 need JDK 21.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
        working-directory: frontend

      # Every exercise image (JPG) and animation (GIF) goes into the APK, so the library works
      # with no internet. Pinned to the same dataset commit as the CDN links (frontend/package.json).
      - name: Cache exercise media
        id: media
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/media
          key: exercise-media-7455efae41b330c265e7cd4b78dfa848e7ce5ebd

      - name: Download exercise media
        if: steps.media.outputs.cache-hit != 'true'
        run: |
          SHA=7455efae41b330c265e7cd4b78dfa848e7ce5ebd
          mkdir -p "$RUNNER_TEMP/media"
          curl -fsSL --retry 5 --retry-delay 5 "https://codeload.github.com/hasaneyldrm/exercises-dataset/tar.gz/$SHA" \
            | tar -xz -C "$RUNNER_TEMP/media" --strip-components=1 --wildcards '*/images/*' '*/videos/*'

      - name: Check exercise media
        run: |
          IMG=$(find "$RUNNER_TEMP/media/images" -type f | wc -l)
          GIF=$(find "$RUNNER_TEMP/media/videos" -type f | wc -l)
          echo "images: $IMG  animations: $GIF  ($(du -sh "$RUNNER_TEMP/media" | cut -f1))"
          if [ "$IMG" -lt 1324 ] || [ "$GIF" -lt 1324 ]; then
            echo "::error title=Exercise media incomplete::expected 1324 images and 1324 animations"
            exit 1
          fi

      # Offline mobile build: VITE_MOBILE web bundle + every exercise media file copied into
      # dist/ (scripts/bundle-media.mjs fails on any missing file) + `cap sync`, which copies
      # dist/ and the native plugins into android/.
      - run: npm run build:mobile:offline
        working-directory: frontend
        env:
          MEDIA_DIR: ${{ runner.temp }}/media

      - name: Select signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PW" ]; then
            echo "Signing with the private release key from repository secrets"
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "MJ_KEYSTORE=$RUNNER_TEMP/release.keystore"
              echo "MJ_KEYSTORE_PASSWORD=$KS_PW"
              echo "MJ_KEY_ALIAS=${KEY_ALIAS:-mahdi-jym}"
              echo "MJ_KEY_PASSWORD=${KEY_PW:-$KS_PW}"
              echo "MJ_KEYSTORE_TYPE=$( [ "${KS_B64:0:4}" = "/u3+" ] && echo jks || echo pkcs12 )"
            } >> "$GITHUB_ENV"
          else
            echo "::notice::No ANDROID_KEYSTORE_* secrets — signing with the committed public keystore"
            {
              echo "MJ_KEYSTORE=$GITHUB_WORKSPACE/frontend/android/keystore/mahdi-jym-public.p12"
              echo "MJ_KEYSTORE_PASSWORD=mahdi-jym-public"
              echo "MJ_KEY_ALIAS=mahdi-jym"
            } >> "$GITHUB_ENV"
          fi

      - name: Build the offline APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          set -o pipefail
          # JVM unit tests of the step counter arithmetic (StepMathTest) run first — a failing
          # test stops the build, so a step-counting regression never ships.
          if ! ./gradlew --no-daemon testReleaseUnitTest assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            # Surface compiler / resource errors as annotations — they are readable through the
            # checks API even where the raw job log isn't.
            msg=$(grep -E "FAILED|AssertionError|expected:|error:|ERROR:|warning: \[|\.java:[0-9]+|\.xml:[0-9]+|AAPT|What went wrong|Execution failed|^> |^  " "$RUNNER_TEMP/gradle.log" \
              | grep -v "^> Task" | head -80 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle build failed::$msg"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/offline.apk"

      # 12.0 — the online (light) version: the same app without the bundled media. A fresh web
      # bundle (scripts/slim-online.mjs leaves the big pictures in the repository), `cap sync`,
      # and a second, incremental Gradle build with the same key.
      - run: npm run build:mobile
        working-directory: frontend

      - name: Build the online APK
        working-directory: frontend/android
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle-online.log"; then
            msg=$(grep -E "FAILED|error:|ERROR:|What went wrong|Execution failed|^> " "$RUNNER_TEMP/gradle-online.log" \
              | grep -v "^> Task" | head -60 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle build failed (online APK)::$msg"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/online.apk"

      - name: Verify signatures and name the files
        id: out
        run: |
          VERSION=$(node -p "require('./frontend/package.json').version")
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --verbose --print-certs "$RUNNER_TEMP/offline.apk" | tee "$RUNNER_TEMP/sig.txt"
          "$APKSIGNER" verify --verbose --print-certs "$RUNNER_TEMP/online.apk" | tee "$RUNNER_TEMP/sig-online.txt"
          # one key for both, so either version installs over the other
          A=$(grep -m1 "SHA-256 digest" "$RUNNER_TEMP/sig.txt"); B=$(grep -m1 "SHA-256 digest" "$RUNNER_TEMP/sig-online.txt")
          if [ "$A" != "$B" ]; then echo "::error title=Signatures differ::$A vs $B"; exit 1; fi
          ON_MB=$(du -m "$RUNNER_TEMP/online.apk" | cut -f1)
          if [ "$ON_MB" -gt 40 ]; then echo "::error title=Online APK too big::${ON_MB} MB — the light version must stay small"; exit 1; fi
          mkdir -p out
          cp "$RUNNER_TEMP/offline.apk" out/MAHDI-JYM.apk
          cp "$RUNNER_TEMP/offline.apk" "out/MAHDI-JYM-v$VERSION.apk"
          cp "$RUNNER_TEMP/online.apk" out/MAHDI-JYM-online.apk
          cp "$RUNNER_TEMP/online.apk" "out/MAHDI-JYM-online-v$VERSION.apk"
          (cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          OFF_MB=$(du -m out/MAHDI-JYM.apk | cut -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "offline_mb=$OFF_MB" >> "$GITHUB_OUTPUT"
          echo "online_mb=$ON_MB" >> "$GITHUB_OUTPUT"
          {
            echo "### MAHDI-JYM v$VERSION — Android APKs"
            echo "- offline (everything inside): ${OFF_MB} MB"
            echo "- online (light): ${ON_MB} MB"
            echo '```'
            grep -E "Verified using|SHA-256 digest" "$RUNNER_TEMP/sig.txt" || true
            cat out/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: MAHDI-JYM-v${{ steps.out.outputs.version }}-apk
          path: out/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          OFF_MB: ${{ steps.out.outputs.offline_mb }}
          ON_MB: ${{ steps.out.outputs.online_mb }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          **MAHDI-JYM ${TAG}** — جسمك، خطتك، إرادتك.

          ### Two versions — the same app, the same features
          | | File | Size | |
          |---|---|---|---|
          | 📦 **Offline** | **MAHDI-JYM.apk** | ${OFF_MB} MB | everything inside — works with no internet |
          | ⚡ **Online (light)** | **MAHDI-JYM-online.apk** | ${ON_MB} MB | exercise pictures, wallpapers and profile pictures load from GitHub |

          Either one installs over the other — your data stays. 🌐 Or use it in the browser: https://m777m44.github.io/Heroes-Jym/app/

          ### Install on Android (6.0+)
          1. Download one of the two APKs below on your phone.
          2. Open it and allow *Install unknown apps* for your browser / file manager when asked.
          3. Tap **Install**. Updates install over the old version — your data stays.

          ### نسختان — التطبيق نفسه وبالميزات نفسها
          - 📦 **أوفلاين** — ملف **MAHDI-JYM.apk** (${OFF_MB} م.ب): كل شيء داخل التطبيق، يعمل بلا إنترنت.
          - ⚡ **أونلاين (خفيف)** — ملف **MAHDI-JYM-online.apk** (${ON_MB} م.ب): صور التمارين والخلفيات وصور الملف الشخصي تُحمَّل من GitHub.
          - تُثبَّت أي نسخة فوق الأخرى وتبقى بياناتك. 🌐 أو استخدمه في المتصفح: https://m777m44.github.io/Heroes-Jym/app/

          ### التثبيت على أندرويد (6.0 أو أحدث)
          1. حمّل أحد الملفين من الأسفل على هاتفك.
          2. افتحه واسمح بـ «تثبيت التطبيقات غير المعروفة» للمتصفح أو مدير الملفات عند الطلب.
          3. اضغط **تثبيت**. التحديثات تُثبَّت فوق النسخة القديمة وتبقى بياناتك.

          See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md) for what's new.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --title "MAHDI-JYM $TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest
          fi
