apply plugin: 'com.android.application'

android {
    namespace "io.github.m777m44.mahdijym"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.m777m44.mahdijym"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 35
        versionName "14.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // 14.0 — two apps that live side by side on one phone, each with its own name, icon and data:
    //   offline  io.github.m777m44.mahdijym         "MAHDI-JYM"         everything inside — the app id
    //            every earlier MAHDI-JYM had, so it installs over them and the data stays (blue OFF badge)
    //   online   io.github.m777m44.mahdijym.online  "MAHDI-JYM Online"  light: pictures from GitHub,
    //            and it updates itself inside the app (lib/liveUpdate.js) — green WEB badge
    // Names in src/online/res/values*, icons in src/{offline,online}/res/mipmap-* (scripts/flavor-icons.sh).
    flavorDimensions 'version'
    productFlavors {
        offline {
            dimension 'version'
        }
        online {
            dimension 'version'
            applicationIdSuffix '.online'
        }
    }
    // Release signing is driven entirely by environment variables, so nothing secret has to
    // live in this file. CI (.github/workflows/android-apk.yml) exports them from repository
    // secrets when present, otherwise from the committed public keystore in ../keystore/.
    // Without MJ_KEYSTORE the release build is left unsigned, exactly as before.
    signingConfigs {
        if (System.getenv('MJ_KEYSTORE')) {
            release {
                storeFile file(System.getenv('MJ_KEYSTORE'))
                storePassword System.getenv('MJ_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MJ_KEY_ALIAS') ?: 'mahdi-jym'
                keyPassword System.getenv('MJ_KEY_PASSWORD') ?: System.getenv('MJ_KEYSTORE_PASSWORD')
                storeType System.getenv('MJ_KEYSTORE_TYPE') ?: 'pkcs12'
                enableV1Signing true
                enableV2Signing true
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('MJ_KEYSTORE')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    // 4.0: the app lock (fingerprint / face, or the phone's PIN) — AppLockPlugin
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // 2.6 — Sign in with Google (account chooser) + an access token for the app's private
    // Google Drive folder. See GoogleAccountPlugin.java and docs/GOOGLE_SIGN_IN.md.
    implementation "com.google.android.gms:play-services-auth:$playServicesAuthVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
